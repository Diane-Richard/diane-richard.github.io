        try {
          var tr = sessionStorage.getItem('px-transition');
          sessionStorage.removeItem('px-transition');
          if (tr && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
            d.dataset.pxTransition = tr;
            d.classList.add('px-arriving');
          }
        } catch (e) {}
      })();
